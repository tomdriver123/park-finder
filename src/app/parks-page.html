<main #sheet [class.is-expanded]="expanded()">
  <div id="sheet" class="sheet-content">
    <app-park-panel [parks]="parks()" [loading]="loading()" [error]="error()" [selectedId]="id()">
      @if (id() !== undefined) {
        <a
          data-slot="start"
          class="back"
          routerLink="/parks"
          aria-label="Back to parks"
          title="Back to parks"
        >
          <svg
            aria-hidden="true"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </a>
      } @else {
        <button
          data-slot="start"
          type="button"
          class="recenter"
          aria-label="Recenter map"
          title="Recenter map"
          (click)="recenter()"
        >
          <svg
            aria-hidden="true"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="12" cy="12" r="6" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
          </svg>
        </button>
      }
      @if (isMobile()) {
        <button
          data-slot="end"
          type="button"
          class="sheet-toggle"
          [attr.aria-expanded]="expanded()"
          aria-controls="sheet"
          [attr.aria-label]="expanded() ? 'Show less' : 'Show more'"
          [title]="expanded() ? 'Show less' : 'Show more'"
          (click)="toggleSheet()"
        >
          <svg
            aria-hidden="true"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 15l7-7 7 7" />
          </svg>
        </button>
      }
    </app-park-panel>
  </div>
</main>
<aside aria-label="Map" (focusin)="onMapFocusIn()">
  <app-park-map
    [parks]="parks()"
    [selectedId]="id()"
    [centerOffset]="centerOffset()"
    [fitRequest]="fitRequest()"
    (select)="onSelect($event)"
  />
</aside>
